<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Worker Contacts — Sri Balamurugan Nagar Welfare Association</title>
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48x48.png" />
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
<style>
  :root{
    --ink:#2A211B; --muted:#6B5D4F; --paper:#FAF3E6; --card:#FFFDF8; --line:#E4D6B8;
    --green:#2F5233; --green-dark:#213B25; --gold:#D9A404; --vermilion:#A6361C;
    --shadow:0 6px 20px rgba(42,33,27,0.08);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--paper); color:var(--ink); line-height:1.5;}
  .container{max-width:1080px; margin:0 auto; padding:0 20px;}

  header{background:var(--green-dark); color:#fff; border-bottom:4px solid var(--gold);}
  .bar{align-items:center; gap:16px; padding:14px 20px; max-width:1080px; margin:0 auto; display:flex; justify-content:space-between;}
  .brand{display:flex; align-items:center; gap:12px; color:#fff; text-decoration:none;}
  .brand img{width:44px; height:44px; border-radius:50%; object-fit:cover;}
  .brand span{font-weight:700; font-size:0.98rem; line-height:1.2;}
  .brand small{display:block; font-weight:400; font-size:0.78rem; color:#C9C0AA;}
  .back{color:#EFE7D2; text-decoration:none; font-size:0.9rem; white-space:nowrap;}
  .back:hover{color:var(--gold);}

  .hero{text-align:center; padding:40px 0 20px;}
  .eyebrow{color:var(--vermilion); font-size:0.78rem; font-weight:700; letter-spacing:0.12em; text-transform:uppercase;}
  .hero h1{font-size:2rem; margin:6px 0 8px;}
  .hero p{color:var(--muted); max-width:560px; margin:0 auto;}

  .tools{display:flex; flex-direction:column; gap:14px; align-items:center; margin:24px 0 8px;}
  .search{width:100%; max-width:420px; padding:12px 16px; border:1px solid var(--line); border-radius:999px; background:var(--card); font-size:0.95rem; color:var(--ink);}
  .search:focus{outline:2px solid var(--green); border-color:var(--green);}
  .chips{display:flex; flex-wrap:wrap; gap:8px; justify-content:center;}
  .chip{border:1px solid var(--line); background:var(--card); color:var(--ink); padding:6px 14px; border-radius:999px; font-size:0.85rem; cursor:pointer;}
  .chip:hover{border-color:var(--green);}
  .chip.active{background:var(--green); border-color:var(--green); color:#fff;}

  .group{margin-top:30px;}
  .group h2{font-size:1.1rem; color:var(--green-dark); padding-bottom:6px; margin-bottom:14px; border-bottom:2px solid var(--line); display:flex; align-items:center; gap:8px;}
  .group h2 .count{font-size:0.75rem; font-weight:600; background:var(--gold); color:var(--ink); border-radius:999px; padding:1px 9px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; box-shadow:var(--shadow); display:flex; align-items:center; gap:14px;}
  .avatar{flex:0 0 46px; height:46px; border-radius:50%; background:var(--green); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700;}
  .info{flex:1; min-width:0;}
  .info h3{font-size:1rem; overflow-wrap:anywhere;}
  .info .mobile{color:var(--muted); font-size:0.88rem;}
  .call{flex:0 0 auto; background:var(--vermilion); color:#fff; text-decoration:none; font-size:0.85rem; font-weight:600; padding:8px 14px; border-radius:999px;}
  .call:hover{background:#832A16;}
  .empty{text-align:center; color:var(--muted); padding:40px 0;}

  footer{margin-top:56px; background:var(--green-dark); color:#C9C0AA; text-align:center; font-size:0.85rem; padding:20px;}
  @media (max-width:520px){.hero h1{font-size:1.5rem;} .brand small{display:none;}}
</style>
</head>
<body>
  <header>
    <div class="bar">
      <a href="/" class="brand">
        <img src="/assets/sbmn-logo.png" alt="Sri Balamurugan Nagar Welfare Association logo" />
        <span>Sri Balamurugan Nagar<small>Welfare Association</small></span>
      </a>
      <a href="/" class="back">&larr; Back to home</a>
    </div>
  </header>

  <main class="container">
    <div class="hero">
      <span class="eyebrow">Helpful Contacts</span>
      <h1>Worker Contacts</h1>
      <p>Plumbers, electricians and other service providers for the Nagar. Tap Call to reach them directly.</p>
    </div>

    <div class="tools">
      <input type="search" class="search" id="search" placeholder="Search by name, profession or number" aria-label="Search contacts" />
      <div class="chips" id="chips"></div>
    </div>

    <div id="list"><p class="empty">Loading…</p></div>
  </main>

  <footer>&copy; <span id="year"></span> Sri Balamurugan Nagar Welfare Association. All rights reserved.</footer>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const list = document.getElementById('list');
    const chips = document.getElementById('chips');
    const searchEl = document.getElementById('search');
    let workers = [];
    let activeProfession = '';

    function renderChips() {
      const professions = [...new Set(workers.map((w) => w.profession))];
      chips.innerHTML = [''].concat(professions)
        .map((p) => `<button type="button" class="chip${p === activeProfession ? ' active' : ''}" data-p="${esc(p)}">${p ? esc(p) : 'All'}</button>`)
        .join('');
    }

    function render() {
      const q = searchEl.value.trim().toLowerCase();
      const visible = workers.filter(
        (w) =>
          (!activeProfession || w.profession === activeProfession) &&
          (!q || `${w.name} ${w.profession} ${w.mobile}`.toLowerCase().includes(q))
      );
      if (!visible.length) {
        list.innerHTML = `<p class="empty">${workers.length ? 'No contacts match your search.' : 'No contacts listed yet.'}</p>`;
        return;
      }
      const groups = {};
      visible.forEach((w) => (groups[w.profession] = groups[w.profession] || []).push(w));
      list.innerHTML = Object.keys(groups)
        .map(
          (p) => `
        <section class="group">
          <h2>${esc(p)} <span class="count">${groups[p].length}</span></h2>
          <div class="grid">
            ${groups[p]
              .map(
                (w) => `
              <div class="card">
                <div class="avatar">${esc(w.name.trim().charAt(0).toUpperCase())}</div>
                <div class="info"><h3>${esc(w.name)}</h3><div class="mobile">${esc(w.mobile)}</div></div>
                <a class="call" href="tel:${esc(w.mobile)}">Call</a>
              </div>`
              )
              .join('')}
          </div>
        </section>`
        )
        .join('');
    }

    chips.addEventListener('click', (e) => {
      const btn = e.target.closest('.chip');
      if (!btn) return;
      activeProfession = btn.dataset.p;
      renderChips();
      render();
    });
    searchEl.addEventListener('input', render);

    (async () => {
      try {
        workers = await Api.get('/public/site/worker-contacts');
      } catch (e) {
        list.innerHTML = '<p class="empty">Could not load contacts. Please try again later.</p>';
        return;
      }
      renderChips();
      render();
    })();
  </script>
</body>
</html>

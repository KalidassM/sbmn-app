<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Donate — Sri Balamurugan Nagar Welfare Association</title>
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <div class="auth-wrap">
    <div class="auth-card" id="card" style="max-width:440px;">
      <h1>Sri Balamurugan Nagar Welfare Association</h1>
      <p class="sub">Support our community — donations from members and well-wishers are welcome</p>
      <div id="alertBox"></div>
      <form id="donateForm">
        <div class="field"><label>Your Name</label><input type="text" id="d_name" required autofocus /></div>
        <div class="field"><label>Email (optional)</label><input type="email" id="d_email" /></div>
        <div class="field"><label>Phone (optional)</label><input type="tel" id="d_phone" /></div>
        <div class="field"><label>Amount (₹)</label><input type="number" id="d_amount" min="1" step="0.01" required /></div>
        <div class="field"><label>Message / Purpose (optional)</label><input type="text" id="d_purpose" placeholder="e.g. General fund, Annual function..." /></div>
        <button type="submit" style="width:100%">Continue to Pay</button>
      </form>
    </div>
  </div>

  <script src="/js/pages/donatePublic.js"></script>
</body>
</html>
